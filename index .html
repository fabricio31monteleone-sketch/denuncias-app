<!-- Manifiesto PWA -->
<link rel="manifest" fill="/manifest.json">

<!-- Icono para iPhone / iPad -->
<link rel="apple-touch-icon" href="icon-512.png">

<!-- Favicon para navegadores -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App de Denuncias - Avellaneda</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0056b3">
  <style>
    :root {
      --primary: #0056b3;
      --secondary: #f4f6f9;
      --dark: #1a252f;
      --light: #ffffff;
      --danger: #d9534f;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--secondary);
      margin: 0;
      padding: 20px;
      color: var(--dark);
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--light);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-option {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--primary);
      background: white;
      color: var(--primary);
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-option.active, .btn-option:hover {
      background: var(--primary);
      color: white;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    select, textarea, input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }
    
    /* Botones de Captura Multimedia */
    .media-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-media {
      flex: 1;
      padding: 10px;
      background: #e9ecef;
      border: 1px dashed var(--primary);
      border-radius: 6px;
      color: var(--primary);
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
    }
    .btn-media:hover {
      background: #dbe2ef;
    }
    .recording {
      background: #f8d7da !important;
      border-color: #dc3545 !important;
      color: #721c24 !important;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    .preview-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .preview-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #ccc;
    }
    .preview-item img, .preview-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-item .remove-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(220, 53, 69, 0.8);
      color: white;
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-submit {
      width: 100%;
      background: #28a745;
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #218838;
    }

    .card-seguridad {
      display: none;
      background: #fff8f8;
      border: 2px solid var(--danger);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .card-seguridad h3 {
      color: var(--danger);
      margin-top: 0;
    }
    .btn-gba {
      display: inline-block;
      margin-top: 15px;
      padding: 14px 24px;
      background: var(--danger);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Denuncias Vecinales - Avellaneda</h1>

  <div class="btn-group">
    <button type="button" class="btn-option active" id="btnMunicipal" onclick="seleccionarTipo('municipal')">Reclamo Municipal</button>
    <button type="button" class="btn-option" id="btnSeguridad" onclick="seleccionarTipo('seguridad')">Delitos / Seguridad</button>
  </div>

  <!-- FORMULARIO MUNICIPAL -->
  <form id="formMunicipal">
    <div class="form-group">
      <label for="tipo">Tipo de Reclamo</label>
      <select id="tipo" required>
        <option value="">Seleccione una opción...</option>
        <option value="Baches / Cuidado de Calles">Baches / Cuidado de Calles</option>
        <option value="Luminaria Apagada / Rota">Luminaria Apagada / Rota</option>
        <option value="Basura / Limpieza Urbana">Basura / Limpieza Urbana</option>
        <option value="Tránsito / Vehículos Abandonados">Tránsito / Vehículos Abandonados</option>
        <option value="Otros Reclamos">Otros Reclamos</option>
      </select>
    </div>

    <div class="form-group">
      <label for="detalle">Detalle de la situación</label>
      <textarea id="detalle" placeholder="Escriba aquí los detalles..." required></textarea>
    </div>

    <!-- CAPTURA FOTO Y VIDEO -->
    <div class="form-group">
      <label>Evidencia Multimedia (Máx. 3 fotos o 1 video de 30s)</label>
      <div class="media-buttons">
        <button type="button" class="btn-media" onclick="document.getElementById('cameraInput').click()">📸 Tomar / Adjuntar Foto</button>
        <button type="button" class="btn-media" id="btnRecord" onclick="toggleGrabarVideo()">🎥 Grabar Video (30s)</button>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" multiple onchange="agregarFotos(this.files)">
      
      <!-- Vista previa -->
      <div class="preview-container" id="previewContainer"></div>
    </div>

    <div class="form-group">
      <label for="ubicacion">Ubicación GPS / Dirección</label>
      <input type="text" id="ubicacion" placeholder="Obteniendo ubicación automáticamente..." readonly>
    </div>

    <button type="button" class="btn-submit" id="btnEnviar" onclick="enviarDenuncia()">Enviar Reclamo</button>
  </form>

  <!-- TARJETA SEGURIDAD GBA -->
  <div id="cardSeguridad" class="card-seguridad">
    <h3>Portal Oficial de Denuncias Anónimas</h3>
    <p>Para denuncias relacionadas con <strong>delitos, robo, narcotráfico o violencia</strong>, el Gobierno de la Provincia de Buenos Aires dispone de una plataforma oficial 100% anónima y segura.</p>
    <a href="https://seguridad.gba.gob.ar/#/home" target="_blank" class="btn-gba">
      Ir al Portal Seguridad GBA ➔
    </a>
  </div>
</div>

<script>
  let listaArchivos = []; // Array para almacenar fotos Base64
  let mediaRecorder;
  let recordedChunks = [];
  let isRecording = false;
  let timerTimeout;

  // Registrar Service Worker para PWA
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error:', err));
  }

  // Obtener ubicación GPS
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById('ubicacion').value = `${pos.coords.latitude}, ${pos.coords.longitude}`;
    },
    () => {
      document.getElementById('ubicacion').value = 'Partido de Avellaneda (Ubicación manual requerida)';
      document.getElementById('ubicacion').removeAttribute('readonly');
    }
  );

  function seleccionarTipo(tipo) {
    const formMuni = document.getElementById('formMunicipal');
    const cardSeg = document.getElementById('cardSeguridad');
    const btnMuni = document.getElementById('btnMunicipal');
    const btnSeg = document.getElementById('btnSeguridad');

    if (tipo === 'municipal') {
      formMuni.style.display = 'block';
      cardSeg.style.display = 'none';
      btnMuni.classList.add('active');
      btnSeg.classList.remove('active');
    } else {
      formMuni.style.display = 'none';
      cardSeg.style.display = 'block';
      btnSeg.classList.add('active');
      btnMuni.classList.remove('active');
    }
  }

  // Gestión de Fotos
  async function agregarFotos(files) {
    if (listaArchivos.length + files.length > 3) {
      alert('Solo puedes adjuntar hasta 3 fotos.');
      return;
    }
    for (let file of files) {
      const base64 = await convertirArchivoABase64(file);
      listaArchivos.push({ filename: file.name, path: base64, type: 'image' });
    }
    actualizarVistaPrevia();
  }

  // Grabar Video de hasta 30 segundos
  async function toggleGrabarVideo() {
    const btnRecord = document.getElementById('btnRecord');

    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        mediaRecorder = new MediaRecorder(stream);
        recordedChunks = [];

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          const blob = new Blob(recordedChunks, { type: 'video/mp4' });
          const file = new File([blob], `video_denuncia_${Date.now()}.mp4`, { type: 'video/mp4' });
          const base64 = await convertirArchivoABase64(file);
          
          listaArchivos.push({ filename: file.name, path: base64, type: 'video' });
          actualizarVistaPrevia();
        };

        mediaRecorder.start();
        isRecording = true;
        btnRecord.classList.add('recording');
        btnRecord.innerText = '⏹️ Detener Grabar (Max 30s)';

        // Límite automático de 30 segundos
        timerTimeout = setTimeout(() => {
          if (isRecording) toggleGrabarVideo();
        }, 30000);

      } catch (err) {
        alert('No se pudo acceder a la cámara/micrófono para grabar el video.');
      }
    } else {
      clearTimeout(timerTimeout);
      mediaRecorder.stop();
      isRecording = false;
      btnRecord.classList.remove('recording');
      btnRecord.innerText = '🎥 Grabar Video (30s)';
    }
  }

  function actualizarVistaPrevia() {
    const container = document.getElementById('previewContainer');
    container.innerHTML = '';

    listaArchivos.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'preview-item';

      if (item.type === 'image') {
        div.innerHTML = `<img src="${item.path}"><button class="remove-btn" onclick="eliminarArchivo(${index})">✕</button>`;
      } else {
        div.innerHTML = `<video src="${item.path}"></video><button class="remove-btn" onclick="eliminarArchivo(${index})">✕</button>`;
      }
      container.appendChild(div);
    });
  }

  function eliminarArchivo(index) {
    listaArchivos.splice(index, 1);
    actualizarVistaPrevia();
  }

  function convertirArchivoABase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  async function enviarDenuncia() {
    const tipo = document.getElementById('tipo').value;
    const detalle = document.getElementById('detalle').value;
    const ubicacion = document.getElementById('ubicacion').value;
    const btnEnviar = document.getElementById('btnEnviar');

    if (!tipo || !detalle) {
      alert('Por favor complete todos los campos requeridos.');
      return;
    }

    btnEnviar.innerText = 'Enviando...';
    btnEnviar.disabled = true;

    try {
      const adjuntosFormatted = listaArchivos.map(item => ({
        filename: item.filename,
        path: item.path
      }));

      const res = await fetch('/api/denuncia', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tipo, detalle, ubicacion, adjuntos: adjuntosFormatted })
      });

      const data = await res.json();
      if (data.success) {
        alert('¡Reclamo enviado con éxito!');
        document.getElementById('formMunicipal').reset();
        listaArchivos = [];
        actualizarVistaPrevia();
      } else {
        alert('Error al enviar: ' + data.message);
      }
    } catch (err) {
      alert('Error de conexión con el servidor.');
    } finally {
      btnEnviar.innerText = 'Enviar Reclamo';
      btnEnviar.disabled = false;
    }
  }
</script>

</body>
</html>
